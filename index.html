<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>晩御飯献立ルーレット</title>
    <style>

        }

            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        }
        .options label:last-child {

        }
        .options input[type="checkbox"] {

            width: 18px;
            height: 18px;
        }
        .filter-input {

            padding: 10px;
            border: 1px solid #ccc;

            font-size: 0.9rem;
            margin-top: 5px;
        }

            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;

        .spin-btn:hover {

        }
        .result-container {
            margin-top: 30px;
            padding: 20px;
            border: 2px dashed #e0e0e0;
            border-radius: 12px;
            display: none;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .result-container.show {
            display: flex;
            opacity: 1;
            border-color: var(--primary-color);
            background-color: #fff9f7;
        }
        .dish-type {
            font-size: 0.8rem;
            color: #888;
            margin-top: 15px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .dish-type:first-child { margin-top: 0; }
        
        .dish-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            line-height: 1.4;
        }
        .recipe-link {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--link-color);
            text-decoration: none;
            border: 1px solid var(--link-color);
            padding: 4px 12px;
            border-radius: 15px;
            transition: all 0.2s;
        }
        .recipe-link:hover {
            background: var(--link-color);
            color: white;
        }
        .advice {
            font-size: 0.85rem;
            color: #d84315;
            margin-top: 20px;
            font-weight: bold;
        }
        .shopping-list {
            margin-top: 20px;
            text-align: left;
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .shopping-list h3 {
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--text-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 5px;
        }
        .shopping-list ul {
            margin: 0;
            padding-left: 20px;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>

        </div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="generateMenu()">献立を決める！</button>

    <div class="result-container" id="resultArea">
        <div id="menuOutput"></div>
    </div>
</div>

        currentSeason = "spring"; seasonLabel = "🌸 春のメニュー";

        currentSeason = "summer"; seasonLabel = "🌻 夏のメニュー";

    // データのパースと結合
    rawNewData.trim().split('\n').forEach(line => {
        const parts = line.split(',');
        if(parts.length < 6) return;
        
        const no = parseInt(parts[0]);
        const base = parts[1];
        const seasons = ['spring', 'summer', 'autumn', 'winter'];

        // カテゴリと栄養素の判定
        let category = "meat";
        let nutrition = "high";
        if (no >= 26 && no <= 50) { category = "fish"; nutrition = "low"; }
        else if (no >= 51 && no <= 75) { category = "carb"; nutrition = "high"; }

        // 各季節ごとのメニューを生成
        for (let i = 0; i < 4; i++) {
            const arrangeText = parts[2 + i];
            // アレンジ名にベース名が含まれていない場合は結合して分かりやすくする
            const displayName = arrangeText.includes(base) ? arrangeText : `${base}（${arrangeText}）`;
            
            // アレンジテキストから簡易的に食材キーワードを抽出（不要な文字を省く）
            const ingredientKeywords = arrangeText.split(/[と・の（）入り多め]/).filter(w => w.length > 0 && w !== '風');
            const ingredients = [base, ...ingredientKeywords];

            seasonalMains[seasons[i]].push({
                name: displayName,
                category: category,
                nutrition: nutrition,
                ingredients: ingredients
            });
        }
    });

    // 既存＋追加いただいた副菜リスト
    const sideDishes = [
        { name: "ほうれん草の胡麻和え", tags: ["veg", "refreshing"], ingredients: ["ほうれん草", "ごま"] },
        { name: "ポテトサラダ", tags: ["carb", "heavy"], ingredients: ["じゃがいも", "マヨネーズ", "きゅうり"] },
        { name: "冷奴", tags: ["protein", "refreshing", "low_cal"], ingredients: ["豆腐", "ねぎ", "生姜"] },
        { name: "きんぴらごぼう", tags: ["veg", "fiber"], ingredients: ["ごぼう", "にんじん"] },
        { name: "大根とワカメの味噌汁", tags: ["soup", "refreshing"], ingredients: ["大根", "ワカメ", "味噌"] },
        { name: "ブロッコリーのマヨ和え", tags: ["veg", "fiber"], ingredients: ["ブロッコリー", "マヨネーズ"] },
        { name: "ひじきの煮物", tags: ["veg", "fiber"], ingredients: ["ひじき", "にんじん", "油揚げ"] },
        { name: "春雨サラダ", tags: ["refreshing"], ingredients: ["春雨", "きゅうり", "ハム"] },
        { name: "たたききゅうり", tags: ["refreshing", "low_cal"], ingredients: ["きゅうり", "ごま油", "塩昆布"] },
        { name: "カボチャの煮付け", tags: ["heavy", "veg"], ingredients: ["かぼちゃ"] },
        { name: "もやしのナムル", tags: ["low_cal", "refreshing"], ingredients: ["もやし", "ごま油", "にんにく"] },
        { name: "コンソメスープ", tags: ["soup"], ingredients: ["玉ねぎ", "コンソメ"] },
        { name: "茶碗蒸し", tags: ["protein"], ingredients: ["卵", "かまぼこ", "しいたけ"] },
        { name: "ちくわの磯辺揚げ", tags: ["heavy"], ingredients: ["ちくわ", "青のり", "小麦粉"] },
        { name: "小松菜のお浸し", tags: ["veg", "low_cal"], ingredients: ["小松菜", "かつおぶし"] },
        { name: "ポトフ風スープ", tags: ["soup", "veg"], ingredients: ["じゃがいも", "にんじん", "ウインナー"] },
        { name: "無限ピーマン", tags: ["veg", "refreshing"], ingredients: ["ピーマン", "ツナ缶", "ごま油"] },
        { name: "厚揚げ焼き", tags: ["protein", "heavy"], ingredients: ["厚揚げ", "しょうが", "醤油"] }
    ];

    // --- ロジック ---
    function getRandomItem(array) {
        return array[Math.floor(Math.random() * array.length)];
    }

    function getRecipeLink(dishName) {
        // 括弧書きの中身やベース名で検索しやすくするためのクレンジング
        const cleanName = dishName.replace(/（.*?）/g, '').trim();
        return `https://cookpad.com/search/${encodeURIComponent(cleanName)}`;
    }

    function getBalancedSideDish(mainDish) {
        let filteredSides = [];
        if (mainDish.category === "meat" || mainDish.nutrition === "high" || mainDish.category === "carb") {
            filteredSides = sideDishes.filter(side => side.tags.includes("refreshing") || side.tags.includes("veg") || side.tags.includes("low_cal") || side.tags.includes("soup"));
        } else {
            filteredSides = sideDishes.filter(side => !side.tags.includes("heavy"));
        }
        if (filteredSides.length === 0) filteredSides = sideDishes;
        return getRandomItem(filteredSides);
    }

    function generateMenu() {
        const skipBreakfast = document.getElementById('skipBreakfast').checked;
        const leftoversInput = document.getElementById('leftovers').value;
        const resultArea = document.getElementById('resultArea');
        const menuOutput = document.getElementById('menuOutput');

        let availableMains = seasonalMains[currentSeason];

        // 余り物フィルターの処理
        if (leftoversInput.trim() !== "") {
            const keywords = leftoversInput.replace(/　/g, " ").split(/[,\s]+/).filter(k => k);
            const filteredMains = availableMains.filter(dish => {
                return dish.ingredients.some(ing => keywords.some(kw => ing.includes(kw)));
            });
            if (filteredMains.length > 0) {
                availableMains = filteredMains;
            }
        }

        resultArea.classList.remove('show');
        setTimeout(() => {
            let selectedMain = getRandomItem(availableMains);

            if (skipBreakfast && selectedMain.nutrition === "low") {
                const highEnergyMains = availableMains.filter(dish => dish.nutrition === "high" || dish.nutrition === "normal");
                if (highEnergyMains.length > 0) {
                    selectedMain = getRandomItem(highEnergyMains);
                }
            }

            const selectedSide = getBalancedSideDish(selectedMain);

            // 買い物リストの生成（ベース名などの不要な情報を整理して表示）
            const rawIngredients = [...selectedMain.ingredients, ...selectedSide.ingredients];
            const cleanIngredients = rawIngredients.filter(ing => ing.length > 1 && !ing.includes("風") && !ing.includes("添え"));
            const uniqueIngredients = [...new Set(cleanIngredients)];
            const shoppingListHtml = uniqueIngredients.map(ing => `<li>${ing}</li>`).join('');

            let adviceHtml = skipBreakfast ? `<div class="advice">💡 朝食を抜いた分、しっかりエネルギーを補給できる組み合わせにしました！</div>` : "";

            menuOutput.innerHTML = `
                <div class="dish-type">主菜</div>
                <div class="dish-name">${selectedMain.name}</div>
                <a href="${getRecipeLink(selectedMain.name)}" target="_blank" class="recipe-link">レシピを検索 🔍</a>

                <div class="dish-type" style="margin-top: 25px;">副菜</div>
                <div class="dish-name">${selectedSide.name}</div>
                <a href="${getRecipeLink(selectedSide.name)}" target="_blank" class="recipe-link">レシピを検索 🔍</a>
                
                ${adviceHtml}

                <div class="shopping-list">
                    <h3>🛒 買い物リスト・必要な食材</h3>
                    <ul>
                        ${shoppingListHtml}
                        <li>(基本調味料・ご飯)</li>
                    </ul>
                </div>
            `;

            resultArea.classList.add('show');
        }, 300);
    }
</script>

</body>
